name: Auto Build and Release

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is master

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to count commits for auto-versioning

      - name: Generate Auto Version & Tag
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="1.0.$COMMIT_COUNT"
          TAG_NAME="v$VERSION"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION, Tag:$TAG_NAME"

      - name: Prepare build directory structure
        run: |
          mkdir -p build/usr/bin
          mkdir -p build/DEBIAN

          # Copy script and set permissions
          cp ext build/usr/bin/ext
          chmod +x build/usr/bin/ext

          # Copy control file and inject dynamic version
          cp debian/control build/DEBIAN/control
          sed -i "s/Version: 1.0.0/Version: ${{ steps.version.outputs.version }}/g" build/DEBIAN/control

      - name: Build Debian package
        run: |
          dpkg-deb --build build ext-cli_${{ steps.version.outputs.version }}_all.deb
          ls -la *.deb

      - name: Delete existing 'latest' tag and release (if any)
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create New Release with Tag
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Release ${{ steps.version.outputs.tag }}"
          body: "Automated build compiled from commit `$(git rev-parse --short HEAD)`."
          files: ext-cli_*_all.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}