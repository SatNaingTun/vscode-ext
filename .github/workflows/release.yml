name: Auto Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Auto Version & Tag
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="1.0.$COMMIT_COUNT"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare build directory structure
        run: |
          mkdir -p build/usr/bin
          mkdir -p build/DEBIAN
          cp ext.py build/usr/bin/ext
          chmod +x build/usr/bin/ext
          cp debian/control build/DEBIAN/control
          sed -i "s/Version: 1.0.0/Version: ${{ steps.version.outputs.version }}/g" build/DEBIAN/control
      
      - name: Ensure control file has a trailing newline
        run: |
          echo "" >> build/DEBIAN/control

      - name: Build Debian package
        run: |
          dpkg-deb --build build ext-cli_${{ steps.version.outputs.version }}_all.deb

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: ext-cli_*_all.deb

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --onefile --name ext ext.py

      - name: Rename Executable
        run: |
          move dist\ext.exe ext-windows.exe

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ext-windows.exe

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --onefile --name ext ext.py

      - name: Rename Executable
        run: |
          mv dist/ext ext-macos

      - name: Upload macOS executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-bin
          path: ext-macos

  release:
    needs: [build, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List files for release
        run: |
          ls -R

      - name: Delete existing 'latest' tag and release (if any)
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create New Release with Tag
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Release Latest"
          body: "Automated multi-platform build for Linux, Windows, and macOS."
          files: |
            linux-deb/ext-cli_*_all.deb
            windows-exe/ext-windows.exe
            macos-bin/ext-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}